<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin E-Perpus - MTsS Nurul Iman Rejo Agung</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --navy: #0A192F;
            --navy-light: #1E3A8A;
            --blue: #2563EB;
            --gold: #F59E0B;
            --white: #FFFFFF;
            --gray-light: #F8FAFC;
            --gray-dark: #334155;
            --border-color: #E2E8F0;
            --danger: #EF4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--gray-light); color: var(--gray-dark); min-height: 100vh; padding: 30px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card-form { background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card-form h2 { font-size: 20px; color: var(--navy); margin-bottom: 20px; border-bottom: 2px solid var(--gray-light); padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
        .btn-submit { background-color: var(--blue); color: var(--white); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-submit:hover { background-color: var(--navy-light); }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--white); border-radius: 8px; overflow: hidden; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .data-table th { background-color: var(--navy); color: var(--white); }
        .btn-danger { background-color: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="font-size: 22px; color: var(--navy);"><i class="fas fa-book"></i> Panel Admin E-Perpus</h1>
            <a href="e-perpus.html" target="_blank" style="font-size: 13px; color: var(--blue); text-decoration: none;"><i class="fas fa-external-link-alt"></i> Lihat Halaman E-Perpus</a>
        </div>

        <!-- FORM TAMBAH BUKU -->
        <div class="card-form">
            <h2>Upload Buku Digital Baru</h2>
            <form id="bookForm">
                <div class="form-group">
                    <label>Judul Buku</label>
                    <input type="text" id="bookTitle" placeholder="Contoh: Modul Fiqih Kelas VII" required>
                </div>
                <div class="form-group">
                    <label>Nama Penulis / Penyusun</label>
                    <input type="text" id="bookAuthor" placeholder="Contoh: Tim Guru Agama MTsS Nurul Iman" required>
                </div>
                <div class="form-group">
                    <label>Kategori Buku</label>
                    <select id="bookCategory">
                        <option value="Buku Paket Pelajaran">Buku Paket Pelajaran</option>
                        <option value="Referensi Agama">Referensi Agama</option>
                        <option value="Novel / Fiksi Islami">Novel / Fiksi Islami</option>
                        <option value="Modul & Lembar Kerja">Modul & Lembar Kerja</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Pilih Gambar Sampul (Cover Buku)</label>
                    <input type="file" id="bookCoverFile" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Link File PDF Buku (Contoh: Link Google Drive PDF)</label>
                    <input type="url" id="bookFileUrl" placeholder="https://drive.google.com/file/d/..." required>
                </div>
                <button type="submit" id="btnSubmitBook" class="btn-submit"><i class="fas fa-upload"></i> Unggah Buku ke E-Perpus</button>
            </form>
        </div>

        <!-- DAFTAR BUKU TERPASANG -->
        <div class="card-form">
            <h2>Kelola Buku Tersimpan</h2>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Judul Buku</th>
                            <th>Penulis</th>
                            <th>Kategori</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-book-list">
                        <tr><td colspan="4" style="text-align: center; color: #94A3B8;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT ADMIN E-PERPUS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCokgJrrjQk7YTTw2iu4-p5S6SvbCCV0g",
            authDomain: "websiteni2026.firebaseapp.com",
            projectId: "websiteni2026",
            storageBucket: "websiteni2026.firebasestorage.app",
            messagingSenderId: "596706822852",
            appId: "1:596706822852:web:febe256e797e71ca0cd791",
            measurementId: "G-Z1XKB3K9L2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function compressImageToBase64(file, maxWidth = 600, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        const bookForm = document.getElementById("bookForm");
        bookForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnSubmitBook");
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Mengunggah...`;

            try {
                const title = document.getElementById("bookTitle").value;
                const author = document.getElementById("bookAuthor").value;
                const category = document.getElementById("bookCategory").value;
                const fileUrl = document.getElementById("bookFileUrl").value;
                const coverFile = document.getElementById("bookCoverFile").files[0];

                let coverBase64 = "";
                if (coverFile) {
                    coverBase64 = await compressImageToBase64(coverFile);
                }

                await addDoc(collection(db, "books"), {
                    title,
                    author,
                    category,
                    fileUrl,
                    cover: coverBase64,
                    createdAt: Date.now()
                });

                alert("Buku berhasil diunggah ke E-Perpus!");
                bookForm.reset();
                renderAdminBooks();
            } catch (err) {
                console.error(err);
                alert("Gagal mengunggah buku: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-upload"></i> Unggah Buku ke E-Perpus`;
            }
        });

        async function renderAdminBooks() {
            const tbody = document.getElementById("admin-book-list");
            try {
                const q = query(collection(db, "books"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94A3B8;">Belum ada buku di perpustakaan.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const book = docSnap.data();
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><strong>${book.title}</strong></td>
                        <td>${book.author}</td>
                        <td>${book.category}</td>
                        <td>
                            <button class="btn-danger" onclick="deleteBook('${docSnap.id}')"><i class="fas fa-trash"></i> Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Gagal memuat daftar buku.</td></tr>`;
            }
        }

        window.deleteBook = async function(docId) {
            if (confirm("Yakin ingin menghapus buku ini dari E-Perpus?")) {
                try {
                    await deleteDoc(doc(db, "books", docId));
                    renderAdminBooks();
                } catch (e) {
                    alert("Gagal menghapus buku: " + e.message);
                }
            }
        };

        renderAdminBooks();
    </script>
</body>
</html>
