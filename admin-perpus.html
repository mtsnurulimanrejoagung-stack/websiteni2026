<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin E-Perpus - MTsS Nurul Iman Rejo Agung</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --navy: #0A192F;
            --navy-light: #1E3A8A;
            --blue: #2563EB;
            --gold: #F59E0B;
            --white: #FFFFFF;
            --gray-light: #F8FAFC;
            --gray-dark: #334155;
            --border-color: #E2E8F0;
            --danger: #EF4444;
            --warning: #D97706;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--gray-light); color: var(--gray-dark); min-height: 100vh; padding: 30px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* KOTAK LOGIN */
        #login-section {
            background: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 400px;
            margin: 80px auto;
            text-align: center;
        }
        #login-section h2 { color: var(--navy); font-size: 22px; margin-bottom: 20px; }

        .card-form { background: var(--white); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card-form h2 { font-size: 20px; color: var(--navy); margin-bottom: 20px; border-bottom: 2px solid var(--gray-light); padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
        
        .btn-submit { background-color: var(--blue); color: var(--white); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-submit:hover { background-color: var(--navy-light); }
        
        .btn-cancel { background-color: #64748B; color: var(--white); border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; display: none; }
        .btn-cancel:hover { background-color: #475569; }

        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: var(--white); border-radius: 8px; overflow: hidden; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border-color); }
        .data-table th { background-color: var(--navy); color: var(--white); }
        
        .btn-warning { background-color: var(--warning); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-danger { background-color: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN ADMIN E-PERPUS -->
    <div id="login-section">
        <h2><i class="fas fa-lock"></i> Login Admin E-Perpus</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUser" placeholder="Masukkan username..." required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="Masukkan password..." required>
            </div>
            <button type="submit" class="btn-submit">Masuk Dashboard</button>
        </form>
        <p style="margin-top: 15px; font-size: 12px;"><a href="e-perpus.html" style="color: var(--blue); text-decoration: none;"><i class="fas fa-arrow-left"></i> Kembali ke E-Perpus Publik</a></p>
    </div>

    <!-- DASHBOARD ADMIN (DISEMBUNYIKAN SAMPAI LOGIN BERHASIL) -->
    <div class="container" id="admin-dashboard" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="font-size: 22px; color: var(--navy);"><i class="fas fa-book"></i> Panel Admin E-Perpus</h1>
            <div>
                <a href="e-perpus.html" target="_blank" style="font-size: 13px; color: var(--blue); text-decoration: none; margin-right: 15px;"><i class="fas fa-external-link-alt"></i> Lihat E-Perpus</a>
                <button id="btnLogout" style="background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <!-- FORM TAMBAH / EDIT BUKU -->
        <div class="card-form">
            <h2 id="form-title">Upload Buku Digital Baru</h2>
            <form id="bookForm">
                <input type="hidden" id="editBookId">
                <div class="form-group">
                    <label>Judul Buku</label>
                    <input type="text" id="bookTitle" placeholder="Contoh: Modul Fiqih Kelas VII" required>
                </div>
                <div class="form-group">
                    <label>Nama Penulis / Penyusun</label>
                    <input type="text" id="bookAuthor" placeholder="Contoh: Tim Guru Agama MTsS Nurul Iman" required>
                </div>
                <div class="form-group">
                    <label>Kategori Buku</label>
                    <select id="bookCategory">
                        <option value="Buku Paket Pelajaran">Buku Paket Pelajaran</option>
                        <option value="Referensi Agama">Referensi Agama</option>
                        <option value="Novel / Fiksi Islami">Novel / Fiksi Islami</option>
                        <option value="Modul & Lembar Kerja">Modul & Lembar Kerja</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Pilih Gambar Sampul Baru (Opsional jika ingin mengganti cover)</label>
                    <input type="file" id="bookCoverFile" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Link File PDF Buku (Contoh: Link Google Drive PDF)</label>
                    <input type="url" id="bookFileUrl" placeholder="https://drive.google.com/file/d/..." required>
                </div>
                <button type="submit" id="btnSubmitBook" class="btn-submit"><i class="fas fa-upload"></i> Unggah Buku ke E-Perpus</button>
                <button type="button" id="btnCancelEdit" class="btn-cancel" onclick="cancelEdit()">Batal Edit</button>
            </form>
        </div>

        <!-- DAFTAR BUKU TERPASANG -->
        <div class="card-form">
            <h2>Kelola Buku Tersimpan</h2>
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Judul Buku</th>
                            <th>Penulis</th>
                            <th>Kategori</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="admin-book-list">
                        <tr><td colspan="4" style="text-align: center; color: #94A3B8;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT ADMIN, LOGIN, DAN EDIT E-PERPUS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, getDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCokgJrrjQk7YTTw2iu4-p5S6SvbCCV0g",
            authDomain: "websiteni2026.firebaseapp.com",
            projectId: "websiteni2026",
            storageBucket: "websiteni2026.firebasestorage.app",
            messagingSenderId: "596706822852",
            appId: "1:596706822852:web:febe256e797e71ca0cd791",
            measurementId: "G-Z1XKB3K9L2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Kredensial Login Admin
        const CORRECT_USER = "admin";
        const CORRECT_PASS = "nuruliman2026";

        const loginSection = document.getElementById("login-section");
        const adminDashboard = document.getElementById("admin-dashboard");

        if (sessionStorage.getItem("perpusLoggedIn") === "true") {
            loginSection.style.display = "none";
            adminDashboard.style.display = "block";
            renderAdminBooks();
        }

        document.getElementById("loginForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const user = document.getElementById("adminUser").value.trim();
            const pass = document.getElementById("adminPassword").value.trim();

            if (user === CORRECT_USER && pass === CORRECT_PASS) {
                sessionStorage.setItem("perpusLoggedIn", "true");
                loginSection.style.display = "none";
                adminDashboard.style.display = "block";
                renderAdminBooks();
            } else {
                alert("Username atau Password salah! Silakan coba lagi.");
            }
        });

        document.getElementById("btnLogout").addEventListener("click", () => {
            sessionStorage.removeItem("perpusLoggedIn");
            window.location.reload();
        });

        function compressImageToBase64(file, maxWidth = 600, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL("image/jpeg", quality));
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        const bookForm = document.getElementById("bookForm");
        bookForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnSubmitBook");
            const editId = document.getElementById("editBookId").value;
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Menyimpan...`;

            try {
                const title = document.getElementById("bookTitle").value;
                const author = document.getElementById("bookAuthor").value;
                const category = document.getElementById("bookCategory").value;
                const fileUrl = document.getElementById("bookFileUrl").value;
                const coverFile = document.getElementById("bookCoverFile").files[0];

                let bookData = {
                    title,
                    author,
                    category,
                    fileUrl
                };

                if (coverFile) {
                    bookData.cover = await compressImageToBase64(coverFile);
                }

                if (editId) {
                    // Update Buku yang Ada
                    await updateDoc(doc(db, "books", editId), bookData);
                    alert("Buku berhasil diperbarui!");
                } else {
                    // Tambah Buku Baru
                    bookData.createdAt = Date.now();
                    await addDoc(collection(db, "books"), bookData);
                    alert("Buku berhasil diunggah ke E-Perpus!");
                }

                cancelEdit();
                renderAdminBooks();
            } catch (err) {
                console.error(err);
                alert("Gagal menyimpan buku: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = editId ? `<i class="fas fa-save"></i> Simpan Perubahan` : `<i class="fas fa-upload"></i> Unggah Buku ke E-Perpus`;
            }
        });

        async function renderAdminBooks() {
            const tbody = document.getElementById("admin-book-list");
            try {
                const q = query(collection(db, "books"), orderBy("createdAt", "desc"));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #94A3B8;">Belum ada buku di perpustakaan.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                snapshot.forEach(docSnap => {
                    const book = docSnap.data();
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><strong>${book.title}</strong></td>
                        <td>${book.author}</td>
                        <td>${book.category}</td>
                        <td>
                            <button class="btn-warning" onclick="editBook('${docSnap.id}')"><i class="fas fa-edit"></i> Edit</button>
                            <button class="btn-danger" onclick="deleteBook('${docSnap.id}')"><i class="fas fa-trash"></i> Hapus</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Gagal memuat daftar buku.</td></tr>`;
            }
        }

        window.editBook = async function(docId) {
            try {
                const docSnap = await getDoc(doc(db, "books", docId));
                if (docSnap.exists()) {
                    const book = docSnap.data();
                    document.getElementById("editBookId").value = docId;
                    document.getElementById("bookTitle").value = book.title;
                    document.getElementById("bookAuthor").value = book.author;
                    document.getElementById("bookCategory").value = book.category;
                    document.getElementById("bookFileUrl").value = book.fileUrl;
                    
                    document.getElementById("form-title").innerText = "Edit Data Buku";
                    document.getElementById("btnSubmitBook").innerHTML = `<i class="fas fa-save"></i> Simpan Perubahan`;
                    document.getElementById("btnCancelEdit").style.display = "block";
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (e) {
                alert("Gagal memuat data buku untuk diedit: " + e.message);
            }
        };

        window.cancelEdit = function() {
            document.getElementById("bookForm").reset();
            document.getElementById("editBookId").value = "";
            document.getElementById("form-title").innerText = "Upload Buku Digital Baru";
            document.getElementById("btnSubmitBook").innerHTML = `<i class="fas fa-upload"></i> Unggah Buku ke E-Perpus`;
            document.getElementById("btnCancelEdit").style.display = "none";
        };

        window.deleteBook = async function(docId) {
            if (confirm("Yakin ingin menghapus buku ini dari E-Perpus?")) {
                try {
                    await deleteDoc(doc(db, "books", docId));
                    renderAdminBooks();
                } catch (e) {
                    alert("Gagal menghapus buku: " + e.message);
                }
            }
        };
    </script>
</body>
</html>
